services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: kurmaflow_backend
    restart: unless-stopped
    environment:
      SNAPGEN_API_BASE: https://api.snapgen.ai
      TZ: Asia/Jakarta
    env_file:
      - .env
    ports:
      - "127.0.0.1:8005:8005"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.json:/app/config.json
      - ./config/models.json:/app/config/models.json
    networks:
      - default
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: kurmaflow_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:80"
    networks:
      - default
      - internal

networks:
  internal:
    external: true

