services:
  postgres:
    image: postgres:16-alpine
    container_name: snapgen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: snapgen
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: snapgen_backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      POSTGRES_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/snapgen
      SNAPGEN_API_BASE: https://api.snapgen.ai
      TZ: Asia/Jakarta
    env_file:
      - .env
    ports:
      - "127.0.0.1:8005:8005"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.json:/app/config.json
      - ./config/models.json:/app/config/models.json

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: snapgen_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: Asia/Jakarta
    ports:
      - "3001:80"

volumes:
  pgdata:

